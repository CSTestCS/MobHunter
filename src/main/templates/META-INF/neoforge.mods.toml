modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="MobHunter Team"
description='''
Monster Hunter inspired hunting for every creature in Minecraft.
Alpha creatures roam with packs, Monstrous beasts are tracked down through hunt contracts,
and Deities wait at their own eldritch shrines. Carve their materials into weapons and armor.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
